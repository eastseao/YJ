<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日卜卦 · 六十四卦</title>
<style>
  :root {
    --bg: #f6f0e4;
    --panel: #fffdf7;
    --ink: #2b2620;
    --ink-soft: #6b6355;
    --accent: #a33327;
    --accent-dark: #7f231a;
    --gold: #b98a2e;
    --line: #e6dcc8;
    --shadow: 0 10px 30px rgba(80, 60, 30, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "STKaiti", "KaiTi", "FangSong", "Noto Serif SC", serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(163,51,39,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(185,138,46,0.06), transparent 40%);
  }

  .header { text-align: center; margin-bottom: 28px; }
  .header h1 {
    font-size: 40px;
    letter-spacing: 12px;
    color: var(--ink);
    font-weight: 700;
  }
  .header .sub {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 15px;
    letter-spacing: 2px;
  }
  .header .date {
    margin-top: 6px;
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .stage {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 960px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 28px 26px;
  }

  /* 左侧 */
  .left { flex: 1 1 380px; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

  .btn {
    font-family: inherit;
    font-size: 22px;
    letter-spacing: 8px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 999px;
    padding: 16px 58px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(163,51,39,0.30);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    position: relative;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(163,51,39,0.38); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }

  .digits {
    display: flex;
    gap: 10px;
    margin: 30px 0 8px;
  }
  .digit {
    width: 52px;
    height: 64px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: #fbf7ed;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    color: var(--ink);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .digit.on { color: var(--accent); border-color: #d9b08a; background: #fdf6ec; }
  .digit.spin { animation: pulse 0.12s ease; }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .digits-label {
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }
  .digits-note { color: var(--ink-soft); font-size: 12px; opacity: 0.8; margin-bottom: 6px; }

  /* 爻图 */
  .hex-wrap { margin-top: 10px; }
  .hex-label {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .hexagram { display: flex; flex-direction: column-reverse; gap: 7px; align-items: center; }
  .yao-line {
    width: 230px;
    height: 15px;
    border-radius: 3px;
    background: var(--ink);
    opacity: 0;
    transform: scaleX(0.2);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .yao-line.yin {
    background: transparent;
    display: flex;
    gap: 40px;
    justify-content: center;
  }
  .yao-line.yin::before, .yao-line.yin::after {
    content: "";
    width: 95px;
    height: 15px;
    border-radius: 3px;
    background: var(--ink);
    display: block;
  }
  .yao-line.show { opacity: 1; transform: scaleX(1); }
  .yao-cap {
    display: flex;
    flex-direction: column-reverse;
    gap: 7px;
    margin-right: 12px;
  }
  .yao-cap span {
    height: 15px; line-height: 15px;
    font-size: 11px; color: var(--ink-soft);
  }

  /* 右侧 */
  .right { flex: 1 1 400px; max-width: 460px; }
  .right.empty { display: flex; align-items: center; justify-content: center; }

  .placeholder {
    text-align: center;
    color: var(--ink-soft);
    opacity: 0.6;
  }
  .placeholder .glyph { font-size: 60px; display: block; margin-bottom: 14px; }

  .gua-head {
    display: flex;
    align-items: center;
    gap: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }
  .gua-symbol { font-size: 78px; line-height: 1; color: var(--accent); }
  .gua-name { font-size: 40px; letter-spacing: 6px; font-weight: 700; }
  .gua-meta { color: var(--ink-soft); font-size: 14px; margin-top: 6px; letter-spacing: 1px; }

  .gua-body { margin-top: 18px; }
  .block { margin-bottom: 16px; }
  .block .tag {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent);
    border: 1px solid #e3c9b0;
    background: #fbf1e4;
    border-radius: 6px;
    padding: 2px 12px;
    margin-bottom: 8px;
  }
  .block .val { font-size: 17px; line-height: 1.7; color: var(--ink); }
  .block.meaning .val { font-size: 20px; letter-spacing: 1px; }
  .block.text .val { color: #4a4336; }

  .footer {
    margin-top: 30px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    opacity: 0.7;
  }

  @media (max-width: 640px) {
    .header h1 { font-size: 30px; letter-spacing: 8px; }
    .digit { width: 42px; height: 54px; font-size: 28px; }
    .yao-line { width: 190px; }
    .yao-line.yin::before, .yao-line.yin::after { width: 78px; }
    .gua-symbol { font-size: 60px; }
    .gua-name { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>每日卜卦</h1>
    <div class="sub">—— 周易 · 六十四卦 ——</div>
    <div class="date" id="today"></div>
  </div>

  <div class="stage">
    <div class="panel left">
      <button class="btn" id="startBtn">开 始</button>

      <div class="digits" id="digits">
        <div class="digit">–</div><div class="digit">–</div><div class="digit">–</div>
        <div class="digit">–</div><div class="digit">–</div><div class="digit">–</div>
      </div>
      <div class="digits-label">初爻 · 二爻 · 三爻 · 四爻 · 五爻 · 上爻</div>
      <div class="digits-note">自下而上 · 1 为阳爻 · 0 为阴爻</div>

      <div class="hex-wrap">
        <div class="hex-label">卦 象</div>
        <div class="hexagram" id="hexagram">
          <div class="yao-line"></div><div class="yao-line"></div><div class="yao-line"></div>
          <div class="yao-line"></div><div class="yao-line"></div><div class="yao-line"></div>
        </div>
      </div>
    </div>

    <div class="panel right empty" id="rightPanel">
      <div class="placeholder">
        <span class="glyph">䷀</span>
        点击「开始」，诚心起卦
      </div>
    </div>
  </div>

  <div class="footer">六十四卦 · 起卦随机 0–63，对应文王卦序 · 卦辞据《周易》通行本</div>

<script>

    {n:2, name:"坤", s:"䷁", up:"坤", dn:"坤", yi:"柔而能刚，厚德载物", yao:"000000", ci:"元亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋。安贞吉。"},
    {n:3, name:"屯", s:"䷂", up:"坎", dn:"震", yi:"草创时刻，充满艰难", yao:"100010", ci:"元亨利贞。勿用有攸往，利建侯。"},
    {n:4, name:"蒙", s:"䷃", up:"艮", dn:"坎", yi:"启蒙发智，尊师敬学", yao:"010001", ci:"亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。"},
    {n:5, name:"需", s:"䷄", up:"坎", dn:"乾", yi:"耐心等待，守持正固", yao:"111010", ci:"有孚，光亨，贞吉。利涉大川。"},
    {n:6, name:"讼", s:"䷅", up:"乾", dn:"坎", yi:"止讼免争，持中不偏", yao:"010111", ci:"有孚窒惕，中吉，终凶。利见大人，不利涉大川。"},
    {n:7, name:"师", s:"䷆", up:"坤", dn:"坎", yi:"统帅兵众，纪律严明", yao:"010000", ci:"贞，丈人吉，无咎。"},
    {n:8, name:"比", s:"䷇", up:"坎", dn:"坤", yi:"相亲相辅，光明无私", yao:"000010", ci:"吉。原筮，元永贞，无咎。不宁方来，后夫凶。"},
    {n:9, name:"小畜", s:"䷈", up:"巽", dn:"乾", yi:"积蓄力量，争取支援", yao:"111011", ci:"亨。密云不雨，自我西郊。"},
    {n:10, name:"履", s:"䷉", up:"乾", dn:"兑", yi:"谦虚谨慎，循礼而行", yao:"110111", ci:"履虎尾，不咥人，亨。"},
    {n:11, name:"泰", s:"䷊", up:"坤", dn:"乾", yi:"阴阳交合，安泰亨通", yao:"111000", ci:"小往大来，吉亨。"},
    {n:12, name:"否", s:"䷋", up:"乾", dn:"坤", yi:"阴阳不合，阻滞闭塞", yao:"000111", ci:"否之匪人，不利君子贞，大往小来。"},
    {n:13, name:"同人", s:"䷌", up:"乾", dn:"离", yi:"大同世界，天下为公", yao:"101111", ci:"同人于野，亨。利涉大川，利君子贞。"},
    {n:14, name:"大有", s:"䷍", up:"离", dn:"乾", yi:"昌盛富有，满不可溢", yao:"111101", ci:"元亨。"},
    {n:15, name:"谦", s:"䷎", up:"坤", dn:"艮", yi:"屈躬下物，先人后己", yao:"001000", ci:"亨，君子有终。"},
    {n:16, name:"豫", s:"䷏", up:"震", dn:"坤", yi:"喜悦和乐，居安思危", yao:"000100", ci:"利建侯行师。"},
    {n:17, name:"随", s:"䷐", up:"兑", dn:"震", yi:"随和众人，顺其自然", yao:"100110", ci:"元亨利贞，无咎。"},
    {n:18, name:"蛊", s:"䷑", up:"艮", dn:"巽", yi:"惩弊治乱，谨始慎终", yao:"011001", ci:"元亨，利涉大川。先甲三日，后甲三日。"},
    {n:19, name:"临", s:"䷒", up:"坤", dn:"兑", yi:"监临天下，恩威并济", yao:"110000", ci:"元亨利贞。至于八月有凶。"},
    {n:20, name:"观", s:"䷓", up:"巽", dn:"坤", yi:"诚信严正，恭敬仰慕", yao:"000011", ci:"盥而不荐，有孚颙若。"},
    {n:21, name:"噬嗑", s:"䷔", up:"离", dn:"震", yi:"小惩大戒，政通人和", yao:"100101", ci:"亨。利用狱。"},
    {n:22, name:"贲", s:"䷕", up:"艮", dn:"离", yi:"美化文饰，恰如其分", yao:"101001", ci:"亨。小利有攸往。"},
    {n:23, name:"剥", s:"䷖", up:"艮", dn:"坤", yi:"小人当道，谨慎隐忍", yao:"000001", ci:"不利有攸往。"},
    {n:24, name:"复", s:"䷗", up:"坤", dn:"震", yi:"正气回复，为所当为", yao:"100000", ci:"亨。出入无疾，朋来无咎。反复其道，七日来复。利有攸往。"},
    {n:25, name:"无妄", s:"䷘", up:"乾", dn:"震", yi:"合乎正道，心安理得", yao:"100111", ci:"元亨利贞。其匪正有眚，不利有攸往。"},
    {n:26, name:"大畜", s:"䷙", up:"艮", dn:"乾", yi:"既富且强，当止则止", yao:"111001", ci:"利贞。不家食吉。利涉大川。"},

    {n:29, name:"坎", s:"䷜", up:"坎", dn:"坎", yi:"同舟共济，突破险难", yao:"010010", ci:"习坎，有孚，维心亨，行有尚。"},
    {n:30, name:"离", s:"䷝", up:"离", dn:"离", yi:"有所依托，柔顺中庸", yao:"101101", ci:"利贞，亨。畜牝牛，吉。"},

    {n:32, name:"恒", s:"䷟", up:"震", dn:"巽", yi:"恒常不变，相依相助", yao:"011100", ci:"亨，无咎，利贞。利有攸往。"},
    {n:33, name:"遁", s:"䷠", up:"乾", dn:"艮", yi:"暂行退避，以图振兴", yao:"001111", ci:"亨，小利贞。"},
    {n:34, name:"大壮", s:"䷡", up:"震", dn:"乾", yi:"声势壮大，诚信自守", yao:"111100", ci:"利贞。"},
    {n:35, name:"晋", s:"䷢", up:"离", dn:"坤", yi:"依附明君，飞黄腾达", yao:"000101", ci:"康侯用锡马蕃庶，昼日三接。"},
    {n:36, name:"明夷", s:"䷣", up:"坤", dn:"离", yi:"内明外柔，韬光养晦", yao:"101000", ci:"利艰贞。"},
    {n:37, name:"家人", s:"䷤", up:"巽", dn:"离", yi:"相亲相爱，各尽本分", yao:"101011", ci:"利女贞。"},
    {n:38, name:"睽", s:"䷥", up:"离", dn:"兑", yi:"因势利导，求同存异", yao:"110101", ci:"小事吉。"},
    {n:39, name:"蹇", s:"䷦", up:"坎", dn:"艮", yi:"遭遇困难，停止不前", yao:"001010", ci:"利西南，不利东北。利见大人，贞吉。"},
    {n:40, name:"解", s:"䷧", up:"震", dn:"坎", yi:"解除困难，与民休息", yao:"010100", ci:"利西南。无所往，其来复吉。有攸往，夙吉。"},
    {n:41, name:"损", s:"䷨", up:"艮", dn:"兑", yi:"减损之道，以诚为本", yao:"110001", ci:"有孚，元吉，无咎，可贞。利有攸往。曷之用，二簋可用享。"},
    {n:42, name:"益", s:"䷩", up:"巽", dn:"震", yi:"助益他人，获得信任", yao:"100011", ci:"利有攸往，利涉大川。"},
    {n:43, name:"夬", s:"䷪", up:"兑", dn:"乾", yi:"清除小人，刚毅果断", yao:"111110", ci:"扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。"},

  const digitEls = Array.from(document.querySelectorAll(".digit"));
  const yaoEls = Array.from(document.querySelectorAll(".yao-line"));
  const hexagram = document.getElementById("hexagram");
  const rightPanel = document.getElementById("rightPanel");
  const startBtn = document.getElementById("startBtn");

  // 日期
  const now = new Date();
  const week = ["日","一","二","三","四","五","六"][now.getDay()];
  document.getElementById("today").textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${week}`;

  // 爻图方向：爻列自下而上（初爻在底部）。SVG/div 用 flex column-reverse 已处理，
  // yaoEls 顺序为 [初,二,三,四,五,上]（DOM 中初爻在最后，但 column-reverse 显示在底部）。
  // 这里统一：yaoEls[i] 对应 yao 字符串第 i 位（i=0 初爻）。

  function renderGua(g) {
    // 数字
    const bits = g.yao.split("");
    bits.forEach((b, i) => {
      digitEls[i].textContent = b;
      digitEls[i].classList.toggle("on", b === "1");
    });
    // 爻图
    bits.forEach((b, i) => {
      const el = yaoEls[i];
      el.classList.toggle("yin", b === "0");
      el.classList.add("show");
    });
    // 右侧
    rightPanel.classList.remove("empty");
    rightPanel.innerHTML = `
      <div class="gua-head">
        <div class="gua-symbol">${g.s}</div>
        <div>
          <div class="gua-name">${g.name}卦</div>
          <div class="gua-meta">第 ${g.n} 卦 · ${g.up}上 ${g.dn}下</div>
        </div>
      </div>
      <div class="gua-body">
        <div class="block meaning">
          <span class="tag">卦 义</span>
          <div class="val">${g.yi}</div>
        </div>
        <div class="block text">
          <span class="tag">卦 辞</span>
          <div class="val">${g.ci}</div>
        </div>
      </div>`;
  }

  function resetVisual() {
    digitEls.forEach(el => { el.textContent = "–"; el.classList.remove("on"); });
    yaoEls.forEach(el => { el.classList.remove("show", "yin"); });
    rightPanel.classList.add("empty");
    rightPanel.innerHTML = `<div class="placeholder"><span class="glyph">䷀</span>点击「开始」，诚心起卦</div>`;
  }

  function start() {
    startBtn.disabled = true;
    resetVisual();

    const target = Math.floor(Math.random() * 64);   // 0–63
    const finalBits = target.toString(2).padStart(6, "0").split("");
    const g = GUA[target];

    // 滚动特效：快速随机翻动数字
    let tick = 0;
    const total = 18;
    const timer = setInterval(() => {
      tick++;
      digitEls.forEach(el => {
        const b = Math.random() < 0.5 ? "0" : "1";
        el.textContent = b;
        el.classList.toggle("on", b === "1");
        el.classList.remove("spin");
        void el.offsetWidth;
        el.classList.add("spin");
      });
      if (tick >= total) {
        clearInterval(timer);
        // 定格
        finalBits.forEach((b, i) => {
          digitEls[i].textContent = b;
          digitEls[i].classList.toggle("on", b === "1");
        });
        // 爻逐条显现
        finalBits.forEach((b, i) => {
          setTimeout(() => {
            yaoEls[i].classList.toggle("yin", b === "0");
            yaoEls[i].classList.add("show");
          }, i * 140);
        });
        // 右侧结果
        setTimeout(() => renderGua(g), finalBits.length * 140 + 120);
        setTimeout(() => { startBtn.disabled = false; }, finalBits.length * 140 + 300);
      }
    }, 60);
  }

  startBtn.addEventListener("click", start);
</script>
</body>
</html>
